<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10191d"><title>Matatu Dash — Nairobi Run</title>
<style>
:root{color-scheme:dark;--bg:#10191d;--panel:#18282c;--panel2:#203438;--line:#49636a;--ink:#f7f3e8;--muted:#aebfc0;--lime:#d8ff58;--gold:#ffcf46;--red:#ff765d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#345c5e 0,#19292d 38%,var(--bg) 78%);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}button{font:inherit}main{width:min(100%,920px)}.topbar{display:flex;justify-content:space-between;align-items:center;margin:0 auto 14px;max-width:760px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;display:grid;place-items:center;border:1px solid #d8ff5840;border-radius:13px;background:linear-gradient(145deg,#d8ff5820,#d8ff5808);font-size:21px}.brand-kicker{color:var(--muted);font-size:9px;font-weight:750;letter-spacing:.2em;text-transform:uppercase}.brand h1{font-size:27px;line-height:1;margin:3px 0 0;letter-spacing:-1.1px}.brand h1 span{color:var(--lime)}.top-actions{display:flex;align-items:center;gap:9px}.wallet{display:flex;align-items:center;gap:7px;padding:8px 12px;background:#ffffff0c;border:1px solid #ffffff12;border-radius:99px;font-weight:800}.wallet b{color:var(--gold)}.iconbtn{width:38px;height:38px;border:1px solid #ffffff1a;border-radius:12px;background:#ffffff0a;color:var(--ink);cursor:pointer}.iconbtn:hover,.softbtn:hover{background:#ffffff18}.shell{position:relative;margin:auto;width:min(100%,760px);padding:10px;border:1px solid #ffffff1b;border-radius:24px;background:linear-gradient(145deg,#ffffff0c,#ffffff03);box-shadow:0 30px 90px #0006}.game{position:relative;overflow:hidden;border:1px solid #ffffff17;border-radius:17px;background:#18282c}.canvas-wrap{position:relative;max-width:620px;margin:auto}canvas{display:block;width:100%;height:auto;touch-action:none}.hud{position:absolute;z-index:1;left:14px;right:14px;top:13px;display:flex;justify-content:space-between;pointer-events:none}.hud-group{display:flex;gap:7px}.stat{min-width:66px;padding:7px 10px;border:1px solid #ffffff1b;border-radius:11px;background:#10191dcc;backdrop-filter:blur(8px)}.stat small{display:block;color:#b6c5c5;font-size:8px;font-weight:800;letter-spacing:.16em}.stat strong{font-size:16px;font-variant-numeric:tabular-nums}.hearts{color:#ff806b;letter-spacing:1px}.pause{position:absolute;right:14px;bottom:14px;z-index:2;border:1px solid #ffffff2e;border-radius:11px;padding:9px 13px;background:#10191de8;color:#fff;font-weight:750;cursor:pointer}.pause[hidden]{display:none}.overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,#0914168c,#091416ba)}.overlay[hidden]{display:none}.panel{width:min(100%,450px);max-height:96%;overflow:auto;padding:25px;border:1px solid #c8e8da30;border-radius:20px;background:linear-gradient(150deg,#21363aF5,#142327F7);box-shadow:0 25px 80px #0009;backdrop-filter:blur(16px)}.panel.center{text-align:center}.eyebrow{color:var(--lime);font-size:9px;font-weight:850;letter-spacing:.2em;text-transform:uppercase}.panel h2{margin:5px 0 8px;font-size:clamp(25px,5vw,36px);line-height:1.03;letter-spacing:-1.3px}.panel p{margin:0 0 16px;color:#c3d0cc;font-size:13px}.hero-icon{margin:0 auto 13px;width:62px;height:62px;display:grid;place-items:center;border-radius:19px;background:linear-gradient(145deg,#d8ff5824,#d8ff5808);border:1px solid #d8ff5844;font-size:32px}.primary,.softbtn{border:0;border-radius:11px;padding:11px 16px;font-weight:850;cursor:pointer;transition:transform .15s,filter .15s}.primary{background:var(--lime);color:#15201b;box-shadow:0 7px 22px #d8ff5822}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}.softbtn{border:1px solid #ffffff24;background:#ffffff0a;color:var(--ink)}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.route-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.route{padding:9px 7px;border:1px solid #ffffff1a;border-radius:11px;background:#ffffff08;color:var(--ink);cursor:pointer;text-align:left}.route.active{border-color:var(--lime);background:#d8ff5810}.route b{display:block;font-size:11px}.route small{color:var(--muted);font-size:9px}.garage-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.garage-head h2{font-size:28px}.carlist{display:grid;gap:7px;margin:12px 0}.carrow{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:10px 11px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff08;text-align:left}.carrow.active{border-color:var(--lime);background:#d8ff580c}.carname{font-size:12px;font-weight:800}.cardesc{display:block;color:var(--muted);font-size:9px}.swatch{display:inline-block;width:18px;height:18px;border-radius:6px;vertical-align:middle;margin-right:8px;border:1px solid #ffffff66}.buy{min-width:94px;padding:7px 9px;border-radius:9px;font-size:10px}.progress{height:6px;margin:12px 0 5px;border-radius:10px;background:#ffffff18;overflow:hidden}.progress i{display:block;height:100%;background:var(--lime);border-radius:10px;transition:width .1s}.route-label{display:flex;justify-content:space-between;color:#c3d0cc;font-size:10px}.mobile-note{display:none}.mobile-controls{display:none;justify-content:space-between;align-items:center;gap:10px;max-width:620px;margin:9px auto 0}.pad{display:flex;gap:8px}.control{width:54px;height:46px;border:1px solid #ffffff26;border-radius:13px;background:#152428;color:#fff;font-size:20px;font-weight:800;touch-action:none;user-select:none}.control.boost{width:86px;color:var(--gold);font-size:11px;letter-spacing:.08em}.control:active{background:#d8ff5830;border-color:var(--lime)}.footer{max-width:760px;display:flex;justify-content:space-between;gap:10px;margin:11px auto 0;color:var(--muted);font-size:10px}.kbd{color:var(--ink);font-weight:800}.toast{position:absolute;top:74px;left:50%;transform:translate(-50%,-8px);z-index:2;padding:8px 13px;border:1px solid #d8ff5855;border-radius:99px;background:#152522ec;color:var(--lime);font-size:11px;font-weight:850;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){body{padding:9px}.topbar{margin-bottom:9px}.brand h1{font-size:22px}.logo{width:37px;height:37px}.shell{padding:6px;border-radius:18px}.game{border-radius:13px}.hud{left:8px;right:8px;top:8px}.hud-group{gap:4px}.stat{min-width:53px;padding:5px 7px;border-radius:9px}.stat strong{font-size:14px}.stat small{font-size:7px}.mobile-controls{display:flex}.mobile-note{display:inline}.footer{font-size:9px}.desktop{display:none}.panel{padding:19px}.wallet{font-size:12px;padding:7px 9px}}

.setting-label{display:block;margin:12px 0 5px;text-align:left;color:#e6eee9;font-size:11px;font-weight:800}.setting-select{width:100%;padding:11px 12px;border:1px solid #ffffff24;border-radius:10px;background:#15272b;color:#f7f3e8;font:inherit;font-size:12px}.pill{display:inline-block;background:#ffffff12;padding:5px 8px;border-radius:99px;color:#c3d0cc;font-size:9px}
@media(max-width:600px){body{display:block;min-height:100svh;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 16px)}main{width:100%;margin:0 auto}.topbar{margin:0 auto 10px}.shell{width:100%;padding:5px;border-radius:17px}.canvas-wrap{width:100%}.overlay{padding:9px}.panel{max-height:92%;padding:17px;border-radius:17px}.panel h2{font-size:29px}.panel p{font-size:12px;margin-bottom:12px}.hero-icon{width:48px;height:48px;font-size:25px;margin-bottom:8px}.route-grid{margin:10px 0}.route{padding:8px 5px}.route b{font-size:10px}.route small{font-size:8px}.actions .primary,.actions .softbtn{padding:10px 12px;font-size:12px}.mobile-controls{gap:12px;margin:10px 2px 0}.control{width:68px;height:58px;border-radius:17px;font-size:24px;box-shadow:0 5px 14px #0004}.control.boost{width:104px;font-size:12px}.pad{gap:9px}.footer{justify-content:center;text-align:center;flex-wrap:wrap;margin-top:9px}.footer>span:last-child{width:100%}.hud{left:7px;right:7px;top:7px}.stat{min-width:49px;padding:5px 6px}.stat strong{font-size:13px}}

@media(max-width:600px){body:has(#pause:not([hidden])){display:block;width:100%;height:100dvh;min-height:100dvh;overflow:hidden;padding:0}body:has(#pause:not([hidden])) main{width:100%;height:100dvh;margin:0}body:has(#pause:not([hidden])) .topbar,body:has(#pause:not([hidden])) .footer{display:none}body:has(#pause:not([hidden])) .shell{width:100%;height:100dvh;margin:0;padding:0;border:0;border-radius:0;box-shadow:none;background:#10191d}body:has(#pause:not([hidden])) .game{height:100%;border:0;border-radius:0}body:has(#pause:not([hidden])) .canvas-wrap{width:100%;height:100%;max-width:none}body:has(#pause:not([hidden])) canvas{width:100%;height:100%;object-fit:fill}body:has(#pause:not([hidden])) .mobile-controls{position:absolute;left:15px;right:15px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:4;display:flex;justify-content:space-between;max-width:none;margin:0;pointer-events:none}body:has(#pause:not([hidden])) .mobile-controls .control{pointer-events:auto;width:66px;height:62px;touch-action:none}body:has(#pause:not([hidden])) .mobile-controls .control.boost{width:100px}body:has(#pause:not([hidden])) .pad{gap:10px}body:has(#pause:not([hidden])) .pause{top:72px;right:12px;bottom:auto}body:has(#pause:not([hidden])) .hud{top:10px;left:10px;right:10px}body:has(#pause:not([hidden])) .stat{background:#10191dee}}
</style></head><body><main>
<header class="topbar"><div class="brand"><div class="logo">🚐</div><div><div class="brand-kicker">Nairobi street racing</div><h1>MATATU <span>DASH</span></h1></div></div><div class="top-actions"><div class="wallet">🟡 <b id="wallet">0</b></div><button class="iconbtn" id="settings" title="Driving settings" aria-label="Driving settings">⚙</button><button class="iconbtn" id="sound" title="Toggle sound" aria-label="Toggle sound">♫</button></div></header>
<div class="shell"><section class="game"><div class="canvas-wrap"><canvas id="game" width="620" height="740" aria-label="Matatu Dash game"></canvas><div class="hud"><div class="hud-group"><div class="stat"><small>DISTANCE</small><strong id="score">0000</strong></div><div class="stat"><small>HULL</small><strong id="health" class="hearts">♥♥♥</strong></div></div><div class="hud-group"><div class="stat"><small>BEST</small><strong id="best">0000</strong></div></div></div><div id="toast" class="toast">+1 COIN</div><button id="pause" class="pause" hidden>Ⅱ &nbsp;Pause</button><div id="overlay" class="overlay"><div id="panel" class="panel center"></div></div></div></section><div class="mobile-controls"><div class="pad"><button class="control" data-hold="left" aria-label="Steer left">←</button><button class="control" data-hold="right" aria-label="Steer right">→</button></div><button class="control boost" data-hold="boost">BOOST ⚡</button></div></div>
<footer class="footer"><span class="desktop">STEER <b class="kbd">← →</b> &nbsp; BOOST <b class="kbd">SPACE</b> &nbsp; PAUSE <b class="kbd">ESC</b></span><span class="mobile-note">Tap the on-screen controls to drive</span><span>Collect K coins · complete route challenges</span></footer></main>
<script>
(()=>{
const $=s=>document.querySelector(s),settingsBtn=$('#settings'),canvas=$('#game'),ctx=canvas.getContext('2d'),overlay=$('#overlay'),panel=$('#panel'),pauseBtn=$('#pause'),toast=$('#toast');
const W=620,road={x:92,w:436},lanes=[166,263,357,454];
let H=740;const cars=[{name:'Classic Matatu',color:'#ef684c',cost:0,desc:'The Nairobi original'},{name:'Coast Cruiser',color:'#28a5bd',cost:35,desc:'Cool blue, coastal style'},{name:'Safari Gold',color:'#e1aa32',cost:80,desc:'A golden road legend'},{name:'Purple Route',color:'#9569bd',cost:140,desc:'Stand out in traffic'},{name:'Electric Lime',color:'#8fbd45',cost:230,desc:'The future is bright'}];
const routes=[{name:'Town Loop',factor:.86,desc:'Relaxed pace'},{name:'Thika Road',factor:1,desc:'Steady traffic'},{name:'Mombasa Road',factor:1.18,desc:'Fast and busy'}];
const db={get(k,d){try{const x=localStorage.getItem('matatuPro:'+k);return x===null?d:JSON.parse(x)}catch{return d}},set(k,v){try{localStorage.setItem('matatuPro:'+k,JSON.stringify(v))}catch{}}};
let wallet=db.get('coins',0),best=db.get('best',0),owned=db.get('owned',[0]),selected=db.get('car',0),routeId=db.get('route',1),soundOn=db.get('sound',true),weather=db.get('weather','clear'),difficulty=db.get('difficulty','normal'),steering=db.get('steering','smooth');
if(!owned.includes(0))owned.push(0);if(!owned.includes(selected)||!cars[selected])selected=0;
let state='menu',score=0,elapsed=0,speed=300,roadOffset=0,spawn=0,coinSpawn=0,last=0,items=[],player={x:lanes[1],y:H*.8,hp:3,invuln:0},boost=100,boosting=false,keys={left:false,right:false},shake=0,flash=0,toastTimer=0,mission=0,missionValue=0,missionDone=false;
const challenges=[{title:'Collector',text:'Collect 10 coins this trip',target:10,unit:'coins'},{title:'Long Haul',text:'Drive for 40 seconds',target:40,unit:'seconds'},{title:'Clean Run',text:'Dodge 14 hazards',target:14,unit:'dodges'}];
function setSceneHeight(full){H=full&&window.innerWidth<=600?Math.max(740,Math.round(W*window.innerHeight/window.innerWidth)):740;canvas.height=H;if(player)player.y=H*.8}function persist(){db.set('coins',wallet);db.set('best',best);db.set('owned',owned);db.set('car',selected);db.set('route',routeId);db.set('weather',weather);db.set('difficulty',difficulty);db.set('steering',steering)}function updateHud(){ $('#wallet').textContent=wallet;$('#best').textContent=String(best).padStart(4,'0');$('#score').textContent=String(Math.floor(score)).padStart(4,'0');$('#health').textContent='♥'.repeat(Math.max(0,player.hp))+'♡'.repeat(3-Math.max(0,player.hp)) }
function beep(freq=550,dur=.07,type='sine'){if(!soundOn)return;try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);o.onended=()=>ac.close()}catch{}}
function showToast(text){toast.textContent=text;toast.classList.add('show');toastTimer=1}
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawRoad(dt){ctx.fillStyle='#223a32';ctx.fillRect(0,0,W,H);ctx.fillStyle='#303a3c';ctx.fillRect(road.x,0,road.w,H);ctx.fillStyle='#ccb894';ctx.fillRect(road.x,0,7,H);ctx.fillRect(road.x+road.w-7,0,7,H);roadOffset=(roadOffset+speed*dt*(H/740))%94;ctx.fillStyle='#d2d2bd';for(const x of [road.x+109,road.x+218,road.x+327])for(let y=-78+roadOffset;y<H;y+=94)ctx.fillRect(x-2,y,4,51);for(let y=-45+(roadOffset*.62)%126;y<H;y+=126){if(routeId===0){ctx.fillStyle='#334e44';ctx.beginPath();ctx.arc(42,y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#72583a';ctx.fillRect(38,y+13,8,23);ctx.fillStyle='#51666a';ctx.fillRect(548,y+5,34,56);ctx.fillStyle='#e9c878';for(let yy=y+13;yy<y+52;yy+=13)for(let xx=555;xx<576;xx+=12)ctx.fillRect(xx,yy,4,5)}else if(routeId===1){ctx.fillStyle='#506d46';ctx.beginPath();ctx.moveTo(25,y+40);ctx.lineTo(42,y-4);ctx.lineTo(59,y+40);ctx.fill();ctx.fillStyle='#72583a';ctx.fillRect(39,y+34,6,20);ctx.fillStyle='#3c5660';ctx.fillRect(552,y+3,40,56);ctx.fillStyle='#d8ff58';ctx.font='bold 8px system-ui';ctx.fillText('THIKA',557,y+19);ctx.fillStyle='#f4d57b';ctx.fillRect(559,y+27,25,3)}else{ctx.fillStyle='#285c58';ctx.fillRect(535,y,85,92);ctx.fillStyle='#5aa4a0';ctx.fillRect(535,y+29,85,4);ctx.fillStyle='#477447';ctx.beginPath();ctx.arc(48,y+22,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#89643b';ctx.fillRect(45,y+25,6,34);ctx.strokeStyle='#477447';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(48,y+25);ctx.quadraticCurveTo(27,y+2,25,y+9);ctx.moveTo(48,y+25);ctx.quadraticCurveTo(64,y+1,72,y+7);ctx.stroke()}}}
function weatherDraw(){if(weather==='night'){ctx.fillStyle='rgba(5,12,28,.43)';ctx.fillRect(road.x,0,road.w,H);ctx.fillStyle='#fff3b0';for(let i=0;i<11;i++){ctx.fillRect(road.x+18+(i*71)%400,125+(i*97)%440,2,2)}}else if(weather==='fog'){ctx.fillStyle='rgba(205,220,215,.17)';ctx.fillRect(road.x,0,road.w,H);const fog=ctx.createLinearGradient(0,120,0,530);fog.addColorStop(0,'rgba(220,230,224,.30)');fog.addColorStop(1,'rgba(220,230,224,0)');ctx.fillStyle=fog;ctx.fillRect(road.x,120,road.w,410)}else if(weather==='rain'){ctx.strokeStyle='rgba(190,220,235,.38)';ctx.lineWidth=1.4;for(let i=0;i<95;i++){const x=road.x+((i*47+roadOffset*1.8)%road.w),y=(i*83+roadOffset*2.8)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+13);ctx.stroke()}}}

function vehicle(x,y,color,kind='matatu',hero=false){ctx.save();ctx.translate(x,y);const w=kind==='truck'?57:kind==='car'?42:48,h=kind==='truck'?93:kind==='car'?67:78;ctx.shadowColor='#0009';ctx.shadowBlur=11;ctx.shadowOffsetY=5;round(-w/2,-h/2,w,h,kind==='truck'?7:10,color);ctx.shadowBlur=0;ctx.shadowOffsetY=0;round(-w*.37,-h*.36,w*.74,h*.25,5,'#b9d9d5');ctx.fillStyle='#283738';ctx.fillRect(-w*.3,-h*.32,w*.25,h*.15);ctx.fillRect(w*.05,-h*.32,w*.25,h*.15);round(-w*.35,h*.04,w*.7,h*.23,4,hero?'#f8d950':'#45595d');ctx.fillStyle='#f8eac9';ctx.fillRect(-w*.39,-h*.45,8,4);ctx.fillRect(w*.22,-h*.45,8,4);ctx.fillStyle='#f36350';ctx.fillRect(-w*.39,h*.42,8,4);ctx.fillRect(w*.22,h*.42,8,4);if(hero){ctx.fillStyle='#18231f';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('MATATU',0,-2);ctx.fillStyle='#dcff5a';ctx.fillRect(-w*.49,-6,4,14);ctx.fillRect(w*.41,-6,4,14)}ctx.restore()}
function coin(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffcf46';ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();ctx.strokeStyle='#fff0a2';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#654914';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('K',0,1);ctx.restore()}
function pit(x,y){ctx.fillStyle='#151b1a';ctx.beginPath();ctx.ellipse(x,y,27,13,0,0,7);ctx.fill();ctx.strokeStyle='#77766c';ctx.lineWidth=2;ctx.stroke()}
function roadblock(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#e45e46';ctx.fillRect(-26,-13,52,26);ctx.fillStyle='#f2e0b2';for(let i=-22;i<25;i+=15){ctx.beginPath();ctx.moveTo(i,-12);ctx.lineTo(i+9,-12);ctx.lineTo(i-2,12);ctx.lineTo(i-11,12);ctx.fill()}ctx.restore()}
function home(message='Dodge traffic, collect coins and build your dream fleet.'){setSceneHeight(false);state='menu';settingsBtn.hidden=false;keys.left=keys.right=false;boosting=false;pauseBtn.hidden=true;overlay.hidden=false;panel.innerHTML=`<div class="hero-icon">🚐</div><div class="eyebrow">Nairobi • Kenya</div><h2>Own the road.</h2><p>${message}</p><div class="route-grid">${routes.map((r,i)=>`<button class="route ${routeId===i?'active':''}" data-route="${i}"><b>${r.name}</b><small>${r.desc}</small></button>`).join('')}</div><div class="actions"><button class="primary" id="play">Start driving&nbsp; →</button><button class="softbtn" id="garage">🚐 &nbsp;Garage</button><button class="softbtn" id="open-settings">⚙ Settings</button></div><p style="margin:14px 0 0;font-size:10px">Current ride: <b style="color:${cars[selected].color}">${cars[selected].name}</b> &nbsp;·&nbsp; Best: ${best}</p>`;$('#play').onclick=start;$('#garage').onclick=garage;$('#open-settings').onclick=settings;document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{routeId=+b.dataset.route;persist();home(message)});draw(0)}
function settings(){state='settings';settingsBtn.hidden=true;pauseBtn.hidden=true;overlay.hidden=false;panel.classList.remove('center');panel.innerHTML=`<div class="garage-head"><div><div class="eyebrow">Tune your drive</div><h2>Settings</h2></div><span class="pill">Saved on this device</span></div><p>Choose how the game feels and what the road looks like.</p><label class="setting-label" for="difficulty">Driving difficulty</label><select class="setting-select" id="difficulty"><option value="easy">Easy · slower traffic</option><option value="normal">Normal · balanced</option><option value="hard">Hard · faster traffic</option></select><label class="setting-label" for="steering">Steering controls</label><select class="setting-select" id="steering"><option value="smooth">Hold to steer smoothly</option><option value="lanes">Tap to change lanes</option></select><label class="setting-label" for="weather">Weather and visibility</label><select class="setting-select" id="weather"><option value="clear">Clear skies</option><option value="rain">Rain shower</option><option value="fog">Misty morning</option><option value="night">Night drive</option></select><div class="actions" style="margin-top:16px"><button class="primary" id="save-settings">Save settings</button><button class="softbtn" id="cancel-settings">Cancel</button></div>`;$('#difficulty').value=difficulty;$('#steering').value=steering;$('#weather').value=weather;$('#save-settings').onclick=()=>{difficulty=$('#difficulty').value;steering=$('#steering').value;weather=$('#weather').value;persist();home('Settings saved. Choose a route and start your drive.')};$('#cancel-settings').onclick=()=>home()}
function garage(){state='garage';settingsBtn.hidden=true;pauseBtn.hidden=true;overlay.hidden=false;panel.classList.remove('center');panel.innerHTML=`<div class="garage-head"><div><div class="eyebrow">Your collection</div><h2>Garage</h2></div><span class="wallet">🟡 <b>${wallet}</b></span></div><p>Unlock a new ride with coins collected on the road.</p><div class="carlist">${cars.map((c,i)=>{const has=owned.includes(i),active=selected===i;return `<div class="carrow ${active?'active':''}"><div><span class="swatch" style="background:${c.color}"></span><span class="carname">${c.name}</span><span class="cardesc">${c.desc}</span></div><button class="${has?'softbtn':'primary'} buy" data-buy="${i}" ${active?'disabled':''}>${active?'Selected':has?'Select':`🟡 ${c.cost}`}</button></div>`}).join('')}</div><button class="softbtn" id="back">← &nbsp;Back to route</button>`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=+b.dataset.buy;if(owned.includes(i)){selected=i;persist();garage()}else if(wallet>=cars[i].cost){wallet-=cars[i].cost;owned.push(i);selected=i;persist();updateHud();beep(820,.1);garage()}else{b.textContent=`Need ${cars[i].cost-wallet} more`;setTimeout(()=>garage(),900)}});$('#back').onclick=()=>home()}
function fresh(){runCoins=0;score=elapsed=0;speed=300*routes[routeId].factor*(difficulty==='easy'?.82:difficulty==='hard'?1.22:1);spawn=.6;coinSpawn=1.15;items=[];player={x:lanes[1],y:590,hp:3,invuln:0};boost=100;boosting=false;missionValue=0;missionDone=false;updateHud()}
function start(){if(window.innerWidth<=600&&document.fullscreenEnabled&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});setSceneHeight(true);fresh();settingsBtn.hidden=true;state='run';overlay.hidden=true;pauseBtn.hidden=false;last=performance.now();beep(560,.12);requestAnimationFrame(loop)}
function pause(){if(state==='run'){settingsBtn.hidden=true;state='paused';keys.left=keys.right=false;boosting=false;pauseBtn.textContent='▶  Resume';overlay.hidden=false;panel.classList.add('center');panel.innerHTML='<div class="hero-icon">Ⅱ</div><div class="eyebrow">Take a breather</div><h2>Trip paused</h2><p>Your route is saved right here. Ready when you are.</p><div class="actions"><button class="primary" id="resume">Resume trip</button><button class="softbtn" id="quit">End trip</button></div>';$('#resume').onclick=resume;$('#quit').onclick=()=>finish(true)}else if(state==='paused')resume()}
function resume(){state='run';overlay.hidden=true;last=performance.now();pauseBtn.textContent='Ⅱ  Pause';requestAnimationFrame(loop)}
function finish(quit=false){if(state!=='run'&&!quit)return;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});setSceneHeight(false);draw(0);settingsBtn.hidden=true;state='over';pauseBtn.hidden=true;best=Math.max(best,Math.floor(score));persist();updateHud();overlay.hidden=false;panel.classList.add('center');panel.innerHTML=`<div class="hero-icon">${quit?'🏁':'💥'}</div><div class="eyebrow">${quit?'Route complete':'That was a close one'}</div><h2>${quit?'Nice driving.':'Trip over.'}</h2><p>Distance <b>${Math.floor(score)}</b> &nbsp;·&nbsp; New coins <b>${runCoins}</b><br>Personal best <b>${best}</b></p><div class="actions"><button class="primary" id="again">Drive again&nbsp; →</button><button class="softbtn" id="garage">Garage</button></div><p style="margin:12px 0 0"><button class="softbtn" id="home">Home</button></p>`;$('#again').onclick=start;$('#garage').onclick=garage;$('#home').onclick=()=>home()}
let runCoins=0;
function hit(){if(player.invuln>0)return;player.hp--;player.invuln=1.25;shake=.22;flash=.2;beep(130,.18,'sawtooth');if(player.hp<=0){finish();return}showToast('HULL DAMAGED');updateHud()}
function update(dt){elapsed+=dt;const level=difficulty==='easy'?.82:difficulty==='hard'?1.22:1;speed=Math.min(610*routes[routeId].factor*level,(300+elapsed*6)*routes[routeId].factor*level);const mult=boosting&&boost>0?1.55:1;if(boosting){boost=Math.max(0,boost-38*dt);if(!boost)boosting=false}else boost=Math.min(100,boost+14*dt);score+=dt*(10+Math.max(0,speed-300)/60);spawn-=dt;coinSpawn-=dt;player.invuln=Math.max(0,player.invuln-dt);if(spawn<=0){const lane=lanes[Math.random()*lanes.length|0],r=Math.random(),type=r<.48?'van':r<.73?'car':r<.89?'pit':'block';items.push({type,x:lane+(Math.random()*14-7),y:-70,color:['#db654f','#37a3ad','#d4a637','#836cb2'][Math.random()*4|0]});spawn=Math.max(.4,(1.06-elapsed*.008)*(difficulty==='easy'?1.28:difficulty==='hard'?.78:1))+Math.random()*.4}if(coinSpawn<=0){items.push({type:'coin',x:lanes[Math.random()*lanes.length|0],y:-24});coinSpawn=1.25+Math.random()*1.1}if(keys.left)player.x-=350*dt;if(keys.right)player.x+=350*dt;player.x=Math.max(road.x+39,Math.min(road.x+road.w-39,player.x));for(const it of items){it.y+=speed*mult*dt*(H/740)*(it.type==='coin'?1.06:1);const collision=Math.abs(it.x-player.x)<(it.type==='van'?42:34)&&Math.abs(it.y-player.y)<(it.type==='van'?62:33);if(collision&&!it.done){it.done=true;if(it.type==='coin'){wallet++;runCoins++;missionValue++;persist();updateHud();showToast('+1 COIN');beep(760,.055)}else{if(mission===2)missionValue++;hit()}}}items=items.filter(i=>i.y<H+75&&!i.done);if(mission===1)missionValue=elapsed;const ch=challenges[mission];if(!missionDone&&missionValue>=ch.target){missionDone=true;wallet+=25;runCoins+=25;persist();updateHud();showToast('CHALLENGE COMPLETE +25');beep(900,.18);mission=(mission+1)%challenges.length;missionValue=0;missionDone=false}updateHud()}
function draw(dt){ctx.save();if(shake>0){shake=Math.max(0,shake-dt);ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8)}drawRoad(dt);weatherDraw();for(const it of items){if(it.type==='van')vehicle(it.x,it.y,it.color,'matatu');else if(it.type==='car')vehicle(it.x,it.y,it.color,'car');else if(it.type==='coin')coin(it.x,it.y);else if(it.type==='pit')pit(it.x,it.y);else roadblock(it.x,it.y)}if(player.invuln===0||(performance.now()/100|0)%2===0)vehicle(player.x,player.y,cars[selected].color,'matatu',true);
// Boost and current route assignment
round(17,79,144,26,8,'#10191dcc');ctx.fillStyle='#ffffff30';ctx.fillRect(26,91,126,5);ctx.fillStyle=boost>22?'#d8ff58':'#ff765d';ctx.fillRect(26,91,126*boost/100,5);ctx.fillStyle='#f8f3e6';ctx.font='bold 9px system-ui';ctx.fillText(boosting?'BOOST ACTIVE':'BOOST',26,87);const ch=challenges[mission],prog=missionValue;round(W-205,78,187,43,8,'#10191dcc');ctx.fillStyle='#f8f3e6';ctx.font='bold 9px system-ui';ctx.fillText('ROUTE CONTRACT',W-194,92);ctx.fillStyle='#c3d0cc';ctx.font='10px system-ui';ctx.fillText(`${ch.title}: ${Math.min(Math.floor(prog),ch.target)} / ${ch.target}`,W-194,108);if(boosting){ctx.fillStyle='#ffffff12';ctx.fillRect(road.x,0,road.w,H)}if(flash>0){ctx.fillStyle=`rgba(255,65,40,${flash/.2*.2})`;ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt)}if(toastTimer>0){toastTimer-=dt;if(toastTimer<.15)toast.classList.remove('show')}ctx.restore()}
function loop(now){if(state!=='run')return;const dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw(dt);if(state==='run')requestAnimationFrame(loop)}
function shiftLane(dir){if(state!=='run')return;let idx=lanes.reduce((bestIdx,x,i)=>Math.abs(x-player.x)<Math.abs(lanes[bestIdx]-player.x)?i:bestIdx,0);player.x=lanes[Math.max(0,Math.min(lanes.length-1,idx+dir))]}function boostDown(){if(state==='run'&&boost>18)boosting=true}function boostUp(){boosting=false}
$('#pause').onclick=pause;$('#settings').onclick=settings;$('#sound').onclick=()=>{soundOn=!soundOn;db.set('sound',soundOn);$('#sound').textContent=soundOn?'♫':'♪̸';$('#sound').title=soundOn?'Sound on':'Sound off';if(soundOn)beep(620,.08)};
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D',' ','Shift'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){if(steering==='lanes')shiftLane(-1);else keys.left=true}if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){if(steering==='lanes')shiftLane(1);else keys.right=true}if(e.key===' '||e.key==='Shift')boostDown();if(e.key==='Escape')pause();if(state==='menu'&&e.key==='Enter')start()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;if(e.key===' '||e.key==='Shift')boostUp()});
document.querySelectorAll('[data-hold]').forEach(b=>{const act=b.dataset.hold,down=e=>{e.preventDefault();if(act==='boost')boostDown();else if(steering==='lanes')shiftLane(act==='left'?-1:1);else keys[act]=true},up=e=>{e.preventDefault();if(act==='boost')boostUp();else keys[act]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});window.addEventListener('pointerup',()=>{keys.left=keys.right=false;boostUp()});window.addEventListener('resize',()=>{if(state==='run'||state==='paused'){setSceneHeight(true);player.y=H*.8;draw(0)}});window.addEventListener('blur',()=>{keys.left=keys.right=false;boostUp();if(state==='run')pause()});$('#sound').textContent=soundOn?'♫':'♪̸';updateHud();home();
})();
</script></body></html>
